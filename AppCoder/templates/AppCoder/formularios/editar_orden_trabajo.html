{% extends 'AppCoder/padre.html' %}
{% block title %}Editar Orden{% endblock %}

{% block contenido %}
<div class="container mt-5">
    <h2 class="mb-4 text-center">Editar Orden de Trabajo</h2>

    <div class="card shadow">
        <div class="card-body">
            <form method="POST" id="editarOrdenForm">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="d-grid gap-2">
                    <button type="button" class="btn btn-success" onclick="mostrarConfirmacion()">Guardar Cambios</button>
                    <a href="{% url 'ordenes_trabajo' %}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>

            <!-- Modal de confirmación -->
            <div class="modal fade" id="confirmarModal" tabindex="-1" aria-labelledby="confirmarModalLabel" aria-hidden="true">
              <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                  <div class="modal-header">
                    <h5 class="modal-title" id="confirmarModalLabel">Confirmar cambios</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                  </div>
                  <div class="modal-body">
                    ¿Desea guardar los cambios?
                  </div>
                  <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Descartar</button>
                    <button type="button" class="btn btn-primary" onclick="enviarFormulario()">Guardar</button>
                  </div>
                </div>
              </div>
            </div>

            <script>
            function mostrarConfirmacion() {
                var modal = new bootstrap.Modal(document.getElementById('confirmarModal'));
                modal.show();
            }
            function enviarFormulario() {
                document.getElementById('editarOrdenForm').submit();
            }
            </script>
        </div>
    </div>
</div>
{% endblock %}
