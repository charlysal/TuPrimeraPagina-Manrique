{% extends 'AppCoder/padre.html' %}
{% block title %}Eliminar Orden{% endblock %}

{% block contenido %}
<div class="container mt-5">
    <div class="alert alert-danger text-center">
        <h4>¿Estás seguro de que querés eliminar esta orden?</h4>
        <p><strong>{{ orden.descripcion }}</strong></p>

        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Sí, eliminar</button>
            <a href="{% url 'ordenes_trabajo' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
