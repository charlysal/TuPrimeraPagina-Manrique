{% extends 'AppCoder/base.html' %}

{% block contenido %}
<h2>Eliminar Usuario</h2>

<p>¿Estás seguro de que querés eliminar al usuario <strong>{{ usuario.username }}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Confirmar Eliminación</button>
</form>

<a href="{% url 'listar_usuarios' %}">Cancelar</a>
{% endblock %}
