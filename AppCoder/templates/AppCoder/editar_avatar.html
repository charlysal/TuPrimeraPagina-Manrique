{% extends 'AppCoder/padre.html' %}
{% block title %}Editar Avatar{% endblock %}
{% block contenido %}
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body">
                    <h4 class="card-title mb-4 text-center">Editar Foto de Perfil</h4>
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <div class="text-center mt-3">
                            <button type="submit" class="btn btn-primary">Guardar</button>
                            <a href="{% url 'inicio' %}" class="btn btn-secondary">Cancelar</a>
                        </div>
                    </form>
                    {% if perfil.imagen %}
                        <div class="text-center mt-4">
                            <img src="{{ perfil.imagen.url }}" class="rounded-circle" width="120" height="120" alt="Avatar actual">
                            <p class="mt-2">Avatar actual</p>
                        </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
