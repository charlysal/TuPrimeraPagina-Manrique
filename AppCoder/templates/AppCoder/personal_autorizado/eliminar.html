{% extends 'AppCoder/base.html' %}
{% block contenido %}
<h2>Eliminar Personal Autorizado</h2>
<p>¿Estás seguro de que quieres eliminar a <strong>{{ persona.user.username }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Confirmar Eliminación</button>
</form>
<a href="{% url 'listar_personal' %}">Cancelar</a>
{% endblock %}
